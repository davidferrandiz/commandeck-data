name: Rastreo de comandantes

# Corre aquí, en el repo público, porque los minutos de Actions son gratis en repos públicos
# y el rastreo dura horas. Compila el crawler desde el repo privado de la app con una deploy key
# de solo lectura (secret COMMANDECK_APP_KEY).
#
# Desde K69 los datos ya no se suben con un commit diario: se publican en Pages con
# deploy-pages (Settings → Pages → Source: GitHub Actions) y el estado entre noches vive en la
# caché de Actions. El historial dejó de crecer (eran ~300 MB de packs). Si la caché se pierde,
# se parte de lo último que hay en la rama main, y el rastreo escalonado lo pone al día.

on:
  schedule:
    - cron: "0 2 * * *" # 04:00 en Madrid en verano, 03:00 en invierno
  workflow_dispatch:
    inputs:
      decks:
        description: "Mazos por comandante"
        default: "150"
      top:
        description: "Cuántos comandantes de crawl-list.json entran en la lista (los 1300 de playgroup y luego los que añade EDHREC)"
        default: "2000"
      minutes:
        description: "Minutos de rastreo antes de publicar lo que haya"
        default: "315"
      top_tier:
        description: "Tamaño del escalón alto del ranking"
        default: "300"
      top_max_age:
        description: "Días que vale un fichero del escalón alto"
        default: "7"
      max_age:
        description: "Días que vale un fichero del resto del ranking (0 = todo)"
        default: "21"
      showcase_max_age:
        description: "Días que vale un fichero de las listas de novedades"
        default: "3"

env:
  DECKS: ${{ github.event.inputs.decks || '150' }}
  TOP: ${{ github.event.inputs.top || '2000' }}
  MINUTES: ${{ github.event.inputs.minutes || '315' }}
  TOP_TIER: ${{ github.event.inputs.top_tier || '300' }}
  TOP_MAX_AGE: ${{ github.event.inputs.top_max_age || '7' }}
  MAX_AGE: ${{ github.event.inputs.max_age || '21' }}
  SHOWCASE_MAX_AGE: ${{ github.event.inputs.showcase_max_age || '3' }}

# Nunca dos rastreos a la vez: el segundo espera a que acabe el primero.
concurrency:
  group: rastreo
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout de la app (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: davidferrandiz/commandeck
          path: app
          ssh-key: ${{ secrets.COMMANDECK_APP_KEY }}

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Aquí y no en el CI de la app: en un repo público no cuesta minutos, y un crawler
      # roto no llega a rastrear ni a publicar nada.
      - name: Tests del crawler
        working-directory: app
        run: ./gradlew :tools:crawler:test --no-daemon

      - name: Datos de anoche
        id: datos
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      # Solo la primera vez, o si la caché se perdió: lo último que se subió a main.
      - name: Datos de main (sin caché)
        if: steps.datos.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          path: datos

      - name: Quitar el git de los datos
        if: steps.datos.outputs.cache-matched-key == ''
        run: rm -rf datos/.git datos/.github

      - name: Caché de mazos
        uses: actions/cache/restore@v4
        with:
          path: mazos.json.gz
          key: mazos-${{ github.run_id }}
          restore-keys: mazos-

      - name: Lista de comandantes desde el ranking publicado
        env:
          DATA_DIR: datos
        run: |
          python3 app/tools/commander-list.py
          test -s comandantes.txt || cp app/comandantes.txt comandantes.txt
          echo "$(wc -l < comandantes.txt) comandantes en la lista"

      - name: Compilar el crawler
        working-directory: app
        run: ./gradlew :tools:crawler:installDist --no-daemon

      # Un fichero que no se pudo refrescar hace que el crawler acabe con error, pero lo que
      # sí salió se publica igual: el paso final es el que marca el run en rojo y manda el correo.
      - name: Rastrear
        id: rastreo
        continue-on-error: true
        env:
          COMMANDECK_DECK_CACHE: ${{ github.workspace }}/mazos.json.gz
        run: |
          app/tools/crawler/build/install/crawler/bin/crawler \
            comandantes.txt datos \
            "$DECKS" "$MINUTES" "$MAX_AGE" "$TOP_TIER" "$TOP_MAX_AGE" "$SHOWCASE_MAX_AGE" \
            2>&1 | tee rastreo.log

      - name: Índice de "Build from your collection"
        # Lee los ficheros de comandante ya en datos/ (los de hoy y los anteriores) y
        # los precios del bulk de Scryfall. Si Scryfall falla, se conserva el índice anterior.
        id: indice
        continue-on-error: true
        run: |
          app/tools/crawler/build/install/crawler/bin/crawler index datos 2>&1 | tee -a rastreo.log

      - name: Guardar la caché de mazos
        if: always() && hashFiles('mazos.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: mazos.json.gz
          key: mazos-${{ github.run_id }}

      - name: Guardar los datos para mañana
        if: always() && hashFiles('datos/commanders.json') != ''
        uses: actions/cache/save@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}

      - name: Guardar el log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rastreo-${{ github.run_id }}
          path: rastreo.log
          retention-days: 14

      - name: Preparar la web
        run: |
          touch datos/.nojekyll
          echo "$(find datos -type f | wc -l) ficheros, $(du -sh datos | cut -f1)"

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: datos

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar si algo no se refrescó
        if: steps.rastreo.outcome == 'failure' || steps.indice.outcome == 'failure'
        run: |
          echo "::error::Algún fichero se quedó como estaba: mira el resumen del run."
          exit 1
